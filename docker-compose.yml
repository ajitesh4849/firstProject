services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foodscan}
      POSTGRES_USER: ${POSTGRES_USER:-foodscan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodscan}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - foodscan_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai_service:
    build: ./ai_service
    restart: unless-stopped
    ports:
      - "${AI_PORT:-8000}:8000"
    environment:
      AI_MODEL_PROVIDER: ${AI_MODEL_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-gpt-4o-mini}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-foodscan}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-foodscan}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-foodscan}
      AI_SERVICE_BASE_URL: http://ai_service:8000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_ALLOW_WEAK_SECRET: ${JWT_ALLOW_WEAK_SECRET:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-20}
      RATE_LIMIT_SCAN_PER_MINUTE: ${RATE_LIMIT_SCAN_PER_MINUTE:-30}
    depends_on:
      postgres:
        condition: service_healthy
      ai_service:
        condition: service_healthy

  website:
    build: ./ui_screens/web_site
    restart: unless-stopped
    ports:
      - "${WEBSITE_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000',r=>process.exit(r.statusCode&&r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  foodscan_pgdata:
