spring:
  datasource:
    url: jdbc:h2:mem:foodscan;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

foodscan:
  jwt:
    secret: test-secret-key-that-is-long-enough-for-hs256!!
    expiration-ms: 3600000
    allow-weak-secret: true
  ai:
    base-url: http://localhost:8000
  rate-limit:
    auth-per-minute: 1000
    scan-per-minute: 1000
    window-ms: 60000
