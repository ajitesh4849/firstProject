spring:
  application:
    name: foodscan-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/foodscan}
    username: ${SPRING_DATASOURCE_USERNAME:foodscan}
    password: ${SPRING_DATASOURCE_PASSWORD:foodscan}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: ${SPRING_MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${SPRING_MULTIPART_MAX_REQUEST_SIZE:12MB}
server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

foodscan:
  ai:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
    connect-timeout-ms: ${AI_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${AI_READ_TIMEOUT_MS:35000}
  openfoodfacts:
    base-url: ${OPENFOODFACTS_BASE_URL:https://world.openfoodfacts.org}
    user-agent: ${OPENFOODFACTS_USER_AGENT:FoodScan/1.0 (https://github.com/ajitesh4849/firstProject)}
    connect-timeout-ms: ${OPENFOODFACTS_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${OPENFOODFACTS_READ_TIMEOUT_MS:15000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:foodscan-dev-secret-change-me-please-32chars-min}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    allow-weak-secret: ${JWT_ALLOW_WEAK_SECRET:true}
  rate-limit:
    auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:20}
    scan-per-minute: ${RATE_LIMIT_SCAN_PER_MINUTE:30}
    window-ms: ${RATE_LIMIT_WINDOW_MS:60000}

logging:
  level:
    com.foodscan: INFO
